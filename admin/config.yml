backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "clientes"
    label: "Clientes que Confían"
    files:
      - name: "lista-clientes"
        label: "Lista de Clientes"
        file: "clientes.json"
        fields:
          - label: "Clientes"
            name: "clientes"
            widget: "list"
            summary: "{{fields.nombre}}"
            allow_add: true
            fields:
              - { label: "Nombre del Cliente/Marca", name: "nombre", widget: "string", required: true }
              - { label: "Descripción", name: "descripcion", widget: "text", required: false }
