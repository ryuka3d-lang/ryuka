backend:
  name: git-gateway
  branch: main

media_folder: ""
public_folder: ""

collections:
  - name: "catalogo"
    label: "Catálogo de Productos Ryuka"
    files:
      - name: "productos"
        label: "Productos"
        file: "productos.json"
        fields:
          - label: "Lista de Productos"
            name: "productos"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "ID (número único)", name: "id", widget: "number" }
              - { label: "Nombre del Producto", name: "title", widget: "string" }
              - { label: "Categoría", name: "category", widget: "string", hint: "Ej: agencia llavero" }
              - { label: "Descripción Corta", name: "shortDesc", widget: "string" }
              - { label: "Descripción Completa", name: "longDesc", widget: "text" }
              - { label: "Imagen (ej: 20.jpeg)", name: "image", widget: "image" }
              - label: "Etiqueta"
                name: "badge"
                widget: "select"
                options:
                  - { label: "Ninguna", value: "" }
                  - { label: "Nuevo", value: "new" }
                  - { label: "Popular", value: "popular" }
