<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Administración - Ryuka</title>
  <script>
    window.CMS_MANUAL_INIT = true;
  </script>
  <script src="https://unpkg.com/decap-cms@^3.1.0/dist/decap-cms.js"></script>
</head>
<body>
  <script>
    const CONFIG = {
      backend: {
        name: 'github',
        repo: 'ryuka3d-lang/ryuka',
        branch: 'main',
        token: '...'
      },
      media_folder: 'images/uploads',
      public_folder: '/images/uploads',
      publish_mode: 'editorial_workflow',
      collections: [
        {
          name: 'catalogo',
          label: 'Catálogo de Productos Ryuka',
          files: [
            {
              name: 'productos',
              label: 'Productos',
              file: 'productos.json',
              fields: [
                {
                  label: 'Lista de Productos',
                  name: 'productos',
                  widget: 'list',
                  summary: '{{fields.title}} ({{fields.category}})',
                  fields: [
                    { label: 'ID (número único)', name: 'id', widget: 'number', required: true },
                    { label: 'Nombre del Producto', name: 'title', widget: 'string', required: true },
                    {
                      label: 'Categoría',
                      name: 'category',
                      widget: 'select',
                      required: true,
                      options: [
                        { label: 'Agencia + Llavero', value: 'agencia llavero' },
                        { label: 'Restaurante + Llavero', value: 'restaurante llavero' },
                        { label: 'Souvenir + Llavero', value: 'souvenir llavero' },
                        { label: 'Fitness + Llavero', value: 'fitness llavero' },
                        { label: 'Música + Llavero', value: 'musica llavero' },
                        { label: 'Llaveros', value: 'llaveros' },
                        { label: 'Llaveros y Deporte', value: 'llaveros y deporte' },
                        { label: 'Deporte', value: 'deporte' },
                        { label: 'Anime', value: 'anime' },
                        { label: 'Niños', value: 'ninos' },
                        { label: 'Niños + Anime', value: 'ninos anime' },
                        { label: 'Souvenir + Niños', value: 'souvenir ninos' },
                        { label: 'Costura', value: 'costura' },
                        { label: 'Souvenir', value: 'souvenir' },
                        { label: 'Fitness', value: 'fitness' },
                        { label: 'Música', value: 'musica' }
                      ],
                      allow_add: true
                    },
                    { label: 'Descripción Corta', name: 'shortDesc', widget: 'string', required: false },
                    { label: 'Descripción Completa', name: 'longDesc', widget: 'text', required: false },
                    { label: 'Precio Unitario', name: 'precioUnitario', widget: 'string', hint: 'Ej: $1.500 c/u', required: false },
                    { label: 'Precio Final / Pack', name: 'precioFinal', widget: 'string', hint: 'Ej: $15.000 (pack x10)', required: false },
                    { label: 'Imagen Principal', name: 'image', widget: 'image', required: false },
                    { label: 'Galería de Fotos (opcional)', name: 'gallery', widget: 'list', required: false, allow_add: true, field: { label: 'Imagen', name: 'img', widget: 'image' } },
                    { label: 'Etiqueta', name: 'badge', widget: 'select', required: false, options: [ { label: 'Ninguna', value: '' }, { label: 'Nuevo', value: 'new' }, { label: 'Popular', value: 'popular' } ] }
                  ]
                }
              ]
            }
          ]
        },
        {
          name: 'clientes',
          label: 'Clientes que Confían',
          files: [
            {
              name: 'lista-clientes',
              label: 'Lista de Clientes',
              file: 'clientes.json',
              fields: [
                {
                  label: 'Clientes',
                  name: 'clientes',
                  widget: 'list',
                  summary: '{{fields.nombre}}',
                  allow_add: true,
                  fields: [
                    { label: 'Nombre del Cliente/Marca', name: 'nombre', widget: 'string', required: true },
                    { label: 'Descripción', name: 'descripcion', widget: 'text', required: false }
                  ]
                }
              ]
            }
          ]
        }
      ]
    };

    if (window.CMS && window.CMS.init) {
      window.CMS.init({ config: CONFIG });
    } else {
      window.addEventListener('DOMContentLoaded', function() {
        if (window.CMS && window.CMS.init) {
          window.CMS.init({ config: CONFIG });
        }
      });
    }
  </script>
</body>
</html>
